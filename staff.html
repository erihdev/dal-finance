<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dal Team">
<meta name="theme-color" content="#f5f5f7">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" media="print" onload="this.media='all'">
<title>Dal Team</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#aeaeb2;--line:#e5e5ea;--fill:#eeeef0;--acc:#F37121;--acc-ink:#c0560f;--acc-soft:#fdeee3;--ok:#248a3d;--ok-soft:#e8f5ec;--bad:#d70015;--bad-soft:#fdebec;--warn:#9a5b00;--warn-soft:#fff4e0;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:6;background:rgba(245,245,247,.86);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 16px 0}
.hd{max-width:640px;margin:0 auto;height:52px;display:flex;align-items:center;gap:10px}
.hd img{width:30px;height:30px;border-radius:8px;flex:none}
.hd .tt{flex:1;min-width:0;line-height:1.15}.hd .tt b{display:block;font-size:15px;font-weight:600}.hd .tt small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lng{display:flex}.lng button{border:0;background:transparent;min-width:44px;height:44px;padding:0;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.lng button span{display:block;padding:5px 9px;background:var(--fill)}.lng button:first-child span{border-start-start-radius:8px;border-end-start-radius:8px}.lng button:last-child span{border-start-end-radius:8px;border-end-end-radius:8px}.lng button[aria-pressed=true] span{background:var(--ink);color:#fff}
.hb{border:0;background:transparent;color:var(--acc-ink);font-size:15px;min-height:44px;padding:0 4px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:8px 16px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;inset-inline:0;z-index:6;background:rgba(250,250,252,.92);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:128px;border:0;background:none;min-height:54px;padding:6px 0 4px;font-size:11px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button[aria-pressed=true]{color:var(--acc-ink)}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:14px 2px 2px}
.sub{font-size:14px;color:var(--ink2);margin:0 2px 12px}
.note{font-size:14px;color:var(--ink2);line-height:1.5;margin:4px 2px 12px}
.grp,.sec{scroll-margin-top:72px}.sec{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 6px}
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
.cell{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;position:relative;width:100%;border:0;background:transparent;text-align:start;cursor:default}
.cell+.cell::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:1px solid var(--line)}
button.cell,.cell[data-item]{cursor:pointer}button.cell:active,.cell[data-item]:active{background:#f2f2f4}
.cell .t{flex:1;min-width:0}.cell .t b{display:block;font-size:16px;font-weight:400;line-height:1.3}.cell .t small{display:block;font-size:13px;color:var(--ink2);line-height:1.4;margin-top:1px}
.cell .v{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}.cell .v b{display:block;font-weight:600;font-size:16px}.cell .v small{display:block;font-size:12px;color:var(--ink2)}
.miss{color:var(--bad)!important}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.n{background:var(--fill);color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;margin-top:10px;text-align:center}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.s{background:var(--card);color:var(--acc-ink);box-shadow:inset 0 0 0 1px var(--line)}.btn.k{background:var(--ink)}.btn.g{background:var(--fill);color:var(--ink)}
.lnk{border:0;background:transparent;color:var(--acc-ink);font-size:16px;min-height:44px;padding:0 6px;cursor:pointer}.lnk.bad{color:var(--bad)}
label.up{display:block}label.up input{display:none}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:10px 12px;font-size:17px;background:#fff;margin:6px 0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.err{color:var(--bad);font-size:14px;min-height:1.3em;margin-top:4px}
.login{max-width:400px;margin:8vh auto 0;text-align:center}.login img{width:64px;height:64px;border-radius:15px}.login h1{margin:12px 0 4px}.login .grp{padding:16px;text-align:start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:12px;margin-bottom:12px}.stats div{padding:12px 6px;text-align:center}.stats div+div{border-inline-start:1px solid var(--line)}.stats b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.stats small{font-size:12px;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;min-height:44px;padding:0 14px;font-size:14px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:8px}.segc button{flex:1;border:0;background:transparent;min-height:36px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.segc button i{width:7px;height:7px;border-radius:50%;display:inline-block}.segc button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.wa{flex:none;width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;margin:4px 0 12px;color:var(--ink2)}.search input{border:0;background:transparent;margin:0;padding:8px 0;min-height:40px}.search input:focus{outline:none}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));inset-inline:16px;max-width:520px;margin:0 auto;background:rgba(29,29,31,.92);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;text-align:center;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.prev{display:flex;gap:10px;overflow-x:auto;padding:12px 16px}.prev figure{margin:0;flex:none;width:96px;text-align:center}.prev img,.prev .pdf{width:96px;height:120px;object-fit:cover;border-radius:8px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink2)}.prev figcaption{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{padding:12px 16px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}
/* الطباعة من المتصفح إن تعذّر الخادم: الشاشة نفسها بلا رأس ولا تبويبات ولا أزرار */
@media print{html,body{background:#fff;color:#000;font-size:12px}header,nav,.toast,.btn,.lnk,.chips,.search,.dm-seg,.dm-num,.lng,[data-ma]{display:none!important}main{max-width:none;padding:0}.grp{border:1px solid #bbb;border-radius:6px;break-inside:avoid;margin-bottom:8px}.cell{min-height:0;padding:6px 10px}h1{font-size:18px}}
</style>
</head>
<body>
<header><div class="hd" id="hd"></div></header>
<main id="m"></main>
<nav id="nav" style="display:none"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* اللغة والأيقونات — مشتركة مع staff-count.js و staff-roast.js */
let LANG='ar';
const T=(ar,en)=>LANG==='en'?en:ar;
window.DALT=T;window.DALLANG=()=>LANG;
const IC={doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',stock:'<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/>',roast:'<path d="M12 21a6 6 0 0 0 6-6c0-5-6-8-6-12 0 0-6 5-6 12a6 6 0 0 0 6 6z"/>',count:'<path d="M4 8V5h4M16 5h4v3M20 16v3h-4M8 19H4v-3M7 12h10"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',cam:'<path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>',torch:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',chat:'<path d="M4 5h16v11H8l-4 4z"/>',move:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',units:'<rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/>',alert:'<path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17v.5"/>'};
const ico=(k,s)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${s?` style="width:${s}px;height:${s}px"`:''}>${IC[k]||''}</svg>`;
window.DALICO=ico;
</script>
<script>
const SRV='https://browser-production-10fb.up.railway.app';window.DALSRV=SRV;
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=x=>x==null||x===''?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:2});
const MN_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],MN_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MN=i=>(LANG==='en'?MN_EN:MN_AR)[i];window.DALMN=MN;
const dTxt=d=>{if(!d)return'—';const x=new Date(String(d).slice(0,10)+'T12:00:00');return isNaN(x)?String(d):x.getDate()+' '+MN(x.getMonth())+' '+x.getFullYear();};
const ymNow=()=>{const n=new Date(Date.now()+3*3600e3);return n.getUTCFullYear()+'-'+String(n.getUTCMonth()+1).padStart(2,'0');};
let TOK='',ME=null,D={},tab='',flt='all',q='',USERS=null,UID='';try{TOK=localStorage.getItem('dal-staff-tok')||'';ME=JSON.parse(localStorage.getItem('dal-staff-me')||'null');}catch(e){}
/* اللغة: اختيار الموظف المحفوظ على الجهاز ← إعداد حسابه إن وُجد ← آخر لغة على الجهاز ← العربية */
function pickLang(){let v=null;try{if(ME&&ME.id)v=localStorage.getItem('dal-staff-lang:'+ME.id);}catch(e){}
  if(!v&&ME)v=ME.lang||ME.language||(ME.prefs&&ME.prefs.lang)||null;
  if(!v){try{v=localStorage.getItem('dal-staff-lang')||localStorage.getItem('dal-count-lang');}catch(e){}}
  LANG=v==='en'?'en':'ar';applyDir();}
function applyDir(){const h=document.documentElement;h.lang=LANG;h.dir=LANG==='en'?'ltr':'rtl';document.title=T('دال — فريق العمل','Dal Team');}
function setLang(l){LANG=l==='en'?'en':'ar';try{localStorage.setItem('dal-staff-lang',LANG);if(ME&&ME.id)localStorage.setItem('dal-staff-lang:'+ME.id,LANG);}catch(e){}applyDir();render();if(window.DALC&&DALC.relang)DALC.relang();}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600);}
async function api(path,opt){const r=await fetch(SRV+path,Object.assign({headers:Object.assign({'content-type':'application/json'},TOK?{Authorization:'Bearer '+TOK}:{})},opt||{}));if(r.status===401){logout();throw new Error('login');}return r.json();}
function logout(){TOK='';ME=null;D={};try{localStorage.removeItem('dal-staff-tok');localStorage.removeItem('dal-staff-me');}catch(e){}pickLang();render();}
/* التطبيق الآن لتحميص العملاء فقط (سلو والعملاء الذين يحضرون بنّهم): مخزون دال وجرده وحركته في فودكس مباشرة. الصفحات الأخرى بقيت في الكود مخفية. */
const PAGES=[['roastx','roast','تحميص العملاء','Customer roasting']];
/* الجرد وحركة المخزون: من يعدّل المحاصيل يملكهما تلقائيًا (كما يفرضه الخادم). صفحة «الوحدات» تظهر داخل تبويب الحركة لمن عنده صلاحية الوحدات */
const can=(p,l)=>{if(!ME||!ME.roles)return false;const r=ME.roles[p]||((p==='count'||p==='move')&&ME.roles.stock==='edit'?'edit':'');return r==='edit'||(l==='view'&&r==='view');};
window.DALCAN=can;
const typing=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#m')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));};
async function load(quiet){const need=new Set(['alerts_stock']);if(can('invoices','view'))need.add('invoices');if(can('move','view')||can('units','view')){['moves','units','stock','count_state','invoices','suppliers','pending_items','customers','docs_out','roast_log','staff_names'].forEach(x=>need.add(x));}if(can('roast','view'))need.add('moves');if(can('stock','view')){need.add('stock');need.add('stock_state');}if(can('roast','view')){need.add('roast_log');need.add('stock');}if(can('roastx','view')){need.add('roast_ext');need.add('docs_out');}if(can('customers','view')||can('messages','view')){['cust_meta','cust_salla','cust_wa','customers','crm_state'].forEach(x=>need.add(x));}
  if(can('count','view')&&window.DALC)await DALC.load(api);if((can('move','view')||can('units','view')||can('roast','view'))&&window.DALC)await DALC.loadUnits(api);
  if(need.size){try{const r=await api('/staff/docs?names='+[...need].join(','));if(r.ok)D=Object.assign(D,r.docs||{});}catch(e){}}
  if(!(quiet&&typing()))render();}
async function refreshMe(){try{const r=await api('/staff/me');if(r.ok&&r.user){const had=ME&&ME.lang;ME=Object.assign({},ME,r.user);try{localStorage.setItem('dal-staff-me',JSON.stringify(ME));}catch(e){}if(!had&&ME.lang)pickLang();}}catch(e){}}
/* ---------- الرأس ---------- */
function header(){const L=LANG;$('#hd').innerHTML=`<img src="icon-180.png" alt="" width="30" height="30"><div class="tt"><b>${T('دال — فريق العمل','Dal Team')}</b>${ME&&TOK?`<small>${esc(ME.name)}</small>`:''}</div>
  <div class="lng" role="group" aria-label="Language"><button data-lang="ar" aria-pressed="${L==='ar'}" lang="ar"><span>عربي</span></button><button data-lang="en" aria-pressed="${L==='en'}" lang="en"><span>EN</span></button></div>${ME&&TOK?`<button class="hb" id="out">${T('خروج','Sign out')}</button>`:''}`;}
/* ---------- الدخول ---------- */
async function loginView(){if(!USERS){$('#m').innerHTML=`<div class="login"><img src="icon-180.png" alt=""><p class="sub">${T('جارٍ التحميل…','Loading…')}</p></div>`;try{const r=await fetch(SRV+'/staff/users').then(r=>r.json());USERS=r.users||[];}catch(e){USERS=[];}if(ME&&TOK)return;}
  const pin=($('#pin')||{}).value||'';UID=($('#uid')||{}).value||UID;
  $('#m').innerHTML=`<div class="login"><img src="icon-180.png" alt=""><h1>${T('فريق دال','Dal Team')}</h1><p class="sub">${T('اختر اسمك وأدخل رمزك.','Choose your name and enter your PIN.')}</p>
  <div class="grp"><label for="uid" class="sub" style="display:block;margin:0">${T('الاسم','Name')}</label><select id="uid">${USERS.map(u=>`<option value="${esc(u.id)}" ${u.id===UID?'selected':''}>${esc(u.name)}</option>`).join('')}</select>
  <label for="pin" class="sub" style="display:block;margin:8px 0 0">${T('الرمز','PIN')}</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" value="${esc(pin)}">
  <div class="err" id="err"></div><button class="btn" id="go">${T('دخول','Sign in')}</button>
  <button class="lnk" id="forgot" type="button" style="display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--acc-ink);font:inherit;font-size:14px;cursor:pointer">${T('نسيت الرمز؟','Forgot your PIN?')}</button><div class="sub" id="forgot-msg" style="margin-top:6px;font-size:13px;line-height:1.5"></div></div></div>`;}
async function doForgot(){const b=$('#forgot'),m=$('#forgot-msg');if(!b||b.disabled)return;const id=($('#uid')||{}).value;if(!id){m.textContent=T('اختر اسمك أولاً','Choose your name first');return;}
  if(!confirm(T('يُرسل طلب للمدير ليصدر لك رمزاً جديداً. متابعة؟','A request goes to the manager to issue you a new PIN. Continue?')))return;b.disabled=true;m.textContent='';
  try{const res=await fetch(SRV+'/staff/forgot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});const r=await res.json().catch(()=>({}));
    if(res.status===429)throw new Error(T('طلبات كثيرة، انتظر ساعة','Too many requests. Wait one hour.'));if(!r.ok)throw new Error(T('تعذّر إرسال الطلب','Could not send the request'));
    m.textContent=r.again?T('طلبك مسجّل من قبل؛ المدير سيرسل لك الرمز الجديد على واتساب.','Your request is already recorded; the manager will send you the new PIN on WhatsApp.'):T('وصل الطلب للمدير. سيرسل لك الرمز الجديد على واتساب.','The manager has been notified. He will send you the new PIN on WhatsApp.');}
  catch(e){m.textContent=e.message==='Failed to fetch'?T('لا يوجد اتصال','No connection'):e.message;b.disabled=false;}}
async function doLogin(){$('#err').textContent='';$('#go').disabled=true;try{const res=await fetch(SRV+'/staff/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:$('#uid').value,pin:$('#pin').value})});const r=await res.json().catch(()=>({}));
    if(!r.ok)throw new Error(res.status===401?T('الرمز غير صحيح','Wrong PIN'):res.status===429?T('محاولات كثيرة، انتظر ساعة','Too many attempts. Wait one hour.'):T('تعذّر الدخول، جرّب مرة ثانية','Could not sign in. Try again.'));
    TOK=r.token;ME=r.user;try{localStorage.setItem('dal-staff-tok',TOK);localStorage.setItem('dal-staff-me',JSON.stringify(ME));}catch(e){}pickLang();render();load();}catch(e){$('#err').textContent=e.message==='Failed to fetch'?T('لا يوجد اتصال','No connection'):e.message;$('#go').disabled=false;}}
/* ---------- الفواتير ---------- */
const MISS_EN={'اسم المورد':'Supplier name','الرقم الضريبي للمورد (15 رقمًا)':'Supplier VAT number (15 digits)','رقم الفاتورة':'Invoice number','التاريخ':'Date','الإجمالي':'Total','مبلغ الضريبة':'VAT amount','اسم المشتري (دال)':'Buyer name (Dal)','الرقم الضريبي لدال':"Dal's VAT number",'رمز QR':'QR code','ليست فاتورة':'Not an invoice'};

const b64of=blob=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob);});
async function decode(file){if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){}}
  return await new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{ok(im);setTimeout(()=>URL.revokeObjectURL(u),1000);};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('decode'));};im.src=u;});}
/* تصغير الصورة في الجوال قبل الرفع: أطول ضلع ≤ 2000px و JPEG بجودة 0.8 */
async function shrink(file){const MAX=2000;if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return {blob:file,mime:file.type||'application/octet-stream',name:file.name};
  let src;try{src=await decode(file);}catch(e){return {blob:file,mime:file.type,name:file.name};}
  const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;const k=Math.min(1,MAX/Math.max(w0,h0));const w=Math.round(w0*k),h=Math.round(h0*k);
  if(k===1&&file.type==='image/jpeg'&&file.size<1.5e6){if(src.close)src.close();return {blob:file,mime:'image/jpeg',name:file.name};}
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(src,0,0,w,h);if(src.close)src.close();
  const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.8));c.width=c.height=0;if(!blob)return {blob:file,mime:file.type,name:file.name};
  return {blob,mime:'image/jpeg',name:String(file.name||'invoice').replace(/\.[a-z0-9]+$/i,'')+'.jpg'};}
async function upload(){const files=PEND.map(p=>p.file);RES=[];let k=0;
  for(const file of files){k++;BUSY=files.length>1?T(`ملف ${k} من ${files.length}`,`File ${k} of ${files.length}`):esc(file.name);render();
    try{const s=await shrink(file);if(s.blob.size>12e6)throw new Error(T('الملف كبير (أكثر من 12 ميجا)','File too large (over 12 MB)'));const b64=await b64of(s.blob);
      const r=await api('/staff/invoice/upload',{method:'POST',body:JSON.stringify({b64,mime:s.mime,meta:{name:s.name}})});
      if(r.ok&&r.rec)RES.push({rec:r.rec});else RES.push({name:file.name,err:r.err==='forbidden'?T('ليس لديك صلاحية','Not allowed'):(r.err||T('خطأ','Error'))});}
    catch(e){RES.push({name:file.name,err:e.message==='Failed to fetch'?T('لا يوجد اتصال','No connection'):e.message});}}
  BUSY=null;PEND.forEach(p=>p.url&&URL.revokeObjectURL(p.url));PEND=[];render();const rs=$('#res');if(rs)rs.scrollIntoView({block:'nearest'});

const MODS={units:['DALU','units-core.js?v=2'],cards:['DALCARDS','dal-cards.js?v=4'],sign:['DALSIGN','dal-sign.js?v=1'],count:['DALC','staff-count.js?v=10'],roast:['DALR','staff-roast.js?v=5'],move:['DALM','staff-move.js?v=5'],roastx:['DALX','staff-xroast.js?v=1']};const MODP={};

function needMod(k){const m=MODS[k];if(window[m[0]])return Promise.resolve();return MODP[k]=MODP[k]||(async()=>{if(k==='roastx'){await needMod('sign');}else if(k!=='units')await needMod('units');if(k==='move'||k==='roast')await needMod('count');if(k==='move'){await needMod('cards');await needMod('sign');}await new Promise((ok,no)=>{const s=document.createElement('script');s.src=m[1];s.onload=async()=>{try{if(k==='count'){await DALC.loadItems();if(can('count','view'))await DALC.load(api);else await DALC.loadUnits(api);}}catch(e){}ok();};s.onerror=()=>{delete MODP[k];s.remove();no();};document.head.appendChild(s);});})().catch(e=>{delete MODP[k];throw e;});}
window.DALNEED=needMod;
window.DALAPI=api;window.DALD=()=>D;window.DALME=()=>ME;window.DALTOAST=toast;window.DALRENDER=()=>render();
pickLang();render();if(ME&&TOK){load();refreshMe();}setInterval(()=>{if(ME&&TOK&&!document.hidden)load(true);},90000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME&&TOK)load(true);});
</script>
</body>
